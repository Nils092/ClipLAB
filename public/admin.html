<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipLab – Admin</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ClipLab Dashboard im imakio-Stil: schwarz-weiß, Poppins + Lora kursiv */
@font-face { font-family: "Poppins"; font-weight: 700; font-display: swap; src: url("fonts/poppins-700.woff") format("woff"); }
@font-face { font-family: "Poppins"; font-weight: 500; font-display: swap; src: url("fonts/poppins-500.woff") format("woff"); }
@font-face { font-family: "Lora"; font-style: italic; font-weight: 400 700; font-display: swap; src: url("fonts/lora-italic.woff") format("woff"); }
:root {
  --bg: #0A0A0A; --panel: #121212; --sunken: #0E0E0E; --ink: #F4F4F4; --muted: #8F8F8F; --line: rgba(255,255,255,.12);
  --ok: #7FD1A3; --ok-soft: rgba(127,209,163,.12); --warn: #E8C37A; --warn-soft: rgba(232,195,122,.12);
  --err: #FF8A80; --err-soft: rgba(255,138,128,.12); --info: #B7C7FF; --info-soft: rgba(183,199,255,.12);
  --font-display: "Poppins", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Poppins", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-serif: "Lora", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: transparent; color: var(--ink); font: 14px/1.55 var(--font-body); -webkit-font-smoothing: antialiased;
  padding: calc(22px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
em { font-family: var(--font-serif); font-style: italic; font-weight: 400; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font: 700 26px/1 var(--font-display); letter-spacing: -0.045em; margin: 0; }
.brand h1 b { font-weight: 700; border-bottom: 3px solid currentColor; padding-bottom: 1px; }
.tally { display: none; }
h2 { font: 700 21px/1.15 var(--font-display); letter-spacing: -0.035em; margin: 0; }
.panel { background: rgba(18,18,18,.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
select { font: inherit; color: var(--ink); background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.switch { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 13px; }
.switch input { width: 18px; height: 18px; accent-color: #fff; }
.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 13px; font-weight: 500; }
input { font: inherit; color: var(--ink); background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
button, .btn { font: inherit; font-weight: 500; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 9px 16px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
button:hover, .btn:hover { border-color: var(--ink); }
.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.primary:hover { background: #fff; }
button:disabled { opacity: .38; cursor: not-allowed; }
input:focus-visible, button:focus-visible, .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
a { color: var(--ink); text-underline-offset: 3px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.hint a { color: var(--muted); }
.banner { padding: 12px 16px; border-radius: 10px; background: var(--info-soft); color: var(--info); font-weight: 500; }
.banner.err { background: var(--err-soft); color: var(--err); }
.acct { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunken); }
.acct .plat { font: 500 10.5px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); width: 82px; }
.acct .name { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-block; font: 500 10.5px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; background: transparent; color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.geplant { background: var(--info-soft); color: var(--info); border-color: transparent; }
.pill.läuft, .pill.verarbeitung { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.veröffentlicht { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.entwurf { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.fehler { background: var(--err-soft); color: var(--err); border-color: transparent; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px; }
th { text-align: left; font: 500 10.5px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 10px 8px; border-bottom: 1px solid var(--line); }
td { padding: 11px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.tc { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; color: var(--muted); }
td small { display: block; color: var(--muted); }
td small.err { color: var(--err); }
.stats { display: flex; gap: 30px; flex-wrap: wrap; }
.stats div { display: flex; flex-direction: column; gap: 4px; }
.stats b { font: 700 34px/1 var(--font-display); letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.stats span { font: 500 10.5px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.plats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .plats { grid-template-columns: minmax(0, 1fr); } }
.plat-card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--sunken); display: flex; flex-direction: column; gap: 10px; }
.plat-card .ph { display: flex; justify-content: space-between; align-items: center; }
.plat-card h3 { font: 700 17px/1.2 var(--font-display); letter-spacing: -.02em; margin: 0; }
.plat-card .accrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
.plat-card .accrow span { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.plat-card .accrow small { display: block; color: var(--err); font-size: 11.5px; }
.plat-card .off { color: var(--muted); font-size: 12.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; } .dot.on { background: var(--ok); }
details.pro summary { cursor: pointer; font: 700 17px/1.2 var(--font-display); list-style: none; display: flex; justify-content: space-between; }
details.pro summary::after { content: "+"; color: var(--muted); } details.pro[open] summary::after { content: "–"; }
code.key { font-family: var(--font-mono); font-size: 12px; background: var(--sunken); border: 1px solid var(--line); padding: 10px 12px; border-radius: 8px; word-break: break-all; display: block; }
.auth { max-width: 420px; margin: 48px auto 0; }
.auth h2 { font-size: 30px; }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }
.foot a { color: var(--muted); }

.kpi { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.kpi div { display: flex; flex-direction: column; gap: 5px; }
.kpi b { font: 700 28px/1 var(--font-display); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.kpi span { font: 500 10px/1.3 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 860px) { .kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 16px; } }
.sys { display: flex; flex-wrap: wrap; gap: 8px; }
.sys span { font-size: 12.5px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--sunken); }
.sys span.ok::before { content: "● "; color: var(--ok); } .sys span.no::before { content: "● "; color: var(--err); } .sys span.warn::before { content: "● "; color: var(--warn); }
.platrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.platrow div { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--sunken); font-size: 13px; }
.platrow b { display: block; font-size: 15px; margin-bottom: 4px; }
@media (max-width: 760px) { .platrow { grid-template-columns: minmax(0, 1fr); } }
h3 { font: 700 16px/1.2 var(--font-display); letter-spacing: -.02em; margin: 0; }
.ulist { display: flex; flex-direction: column; }
.urow { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr) repeat(4, 64px) 110px auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.urow.head { font: 500 10px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 8px 0; }
.urow b { font-weight: 600; } .urow small { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.urow .n { text-align: right; font-variant-numeric: tabular-nums; } .urow .n.err { color: var(--err); }
.urow .act { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; } .urow .act button { padding: 5px 10px; font-size: 12px; }
.tag { font: 500 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; vertical-align: 2px; }
.tag.admin { background: var(--ink); color: var(--bg); border-color: var(--ink); } .tag.off { background: var(--err-soft); color: var(--err); border-color: transparent; } .tag.unv { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
@media (max-width: 860px) { .urow { grid-template-columns: minmax(0, 1fr) auto; } .urow.head { display: none; } .urow > :nth-child(n+3):not(.act) { display: none; } .urow .act { grid-column: 1 / -1; justify-content: flex-start; } }
.probs { display: flex; flex-direction: column; } .probs div { display: grid; grid-template-columns: 110px 120px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.probs .t { font-family: var(--font-mono); color: var(--muted); font-size: 11.5px; } .probs .x { color: var(--err); overflow-wrap: anywhere; }
@media (max-width: 760px) { .probs div { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.search { max-width: 260px; }
</style>
</head>
<body>
<script src="/bg.js?v=2"></script>
<script src="/nav.js?v=8"></script>
<div class="wrap">
  <div class="row between"><div><h2 style="font-size:30px">Ad<em>min</em></h2><p class="hint">Nur für dich sichtbar · Überblick über alle Clipper und das System</p></div><button id="reload" class="small">Aktualisieren</button></div>
  <div class="banner" id="banner" hidden></div>

  <section class="panel"><div class="kpi" id="kpi"></div></section>

  <div class="grid">
    <section class="panel stack"><h3>Plattformen</h3><div class="platrow" id="plat"></div></section>
    <section class="panel stack"><h3>System</h3><div class="sys" id="sys"></div></section>
  </div>

  <section class="panel stack">
    <div class="row between"><h3>Clipper</h3><input class="search" id="q" placeholder="Name oder E-Mail suchen"></div>
    <div class="row"><span class="hint">Einladungslink:</span><code class="key" id="inviteLink" style="flex:1 1 260px"></code><button id="copyInvite" class="small">Kopieren</button></div>
    <div class="ulist" id="users"></div>
  </section>

  <section class="panel stack">
    <h3>Probleme <span class="hint" id="probCount"></span></h3>
    <div class="probs" id="probs"></div>
    <button id="probMore" class="small" hidden style="align-self:flex-start">Alle anzeigen</button>
  </section>
  <p class="foot">ClipLab ist ein Projekt von <a href="https://imakio.de">imakio</a></p>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const api = async (url, opts = {}) => {
    const r = await fetch(url, { credentials: "same-origin", headers: opts.body ? { "Content-Type": "application/json" } : {}, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 || r.status === 403) { location.href = "/"; throw new Error("Kein Zugriff"); }
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  };
  const banner = (msg, err) => { const b = $("banner"); b.textContent = msg; b.className = "banner" + (err ? " err" : ""); b.hidden = !msg; };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (n) => Number(n || 0).toLocaleString("de-DE");
  const ago = (iso) => { if (!iso) return "nie"; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 2 ? "gerade eben" : m < 60 ? `vor ${m} Min.` : m < 1440 ? `vor ${Math.round(m / 60)} Std.` : `vor ${Math.round(m / 1440)} T.`; };
  const fmt = (iso) => iso ? new Date(iso).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" }) : "–";
  const PN = { tiktok: "TikTok", instagram: "Instagram", youtube: "YouTube" };
  let session, users = [], probs = [], allProbs = false;
  function renderProbs() {
    const list = allProbs ? probs : probs.slice(0, 8);
    $("probs").innerHTML = probs.length ? list.map((p) => `<div><span class="t">${fmt(p.at)}</span><span>${esc(p.user)}</span><span class="x">${esc(p.text)}${p.n > 1 ? ` <span class="hint">· ${p.n}×</span>` : ""}</span></div>`).join("") : '<p class="hint">Keine offenen Probleme.</p>';
    $("probMore").hidden = probs.length <= 8; $("probMore").textContent = allProbs ? "Weniger anzeigen" : `Alle ${probs.length} anzeigen`;
  }

  async function loadOverview() {
    const o = await api("/api/admin/overview"), t = o.totals, s = o.system;
    $("kpi").innerHTML = [["Clipper", t.users, `${t.active7} aktiv (7 T.)`], ["Accounts", t.accounts], ["Projekte", t.projects], ["Online", t.published, `${t.published24} in 24 h`], ["Warteschlange", t.queued], ["Fehler", t.errors], ["Views", num(t.views)]]
      .map(([l, v, sub]) => `<div><b>${v}</b><span>${l}${sub ? `<br>${sub}` : ""}</span></div>`).join("");
    $("plat").innerHTML = o.byPlatform.map((p) => `<div><b>${PN[p.platform]}</b>${p.accounts} Accounts · ${p.published} online${p.errors ? ` · <span style="color:var(--err)">${p.errors} Fehler</span>` : ""}</div>`).join("");
    const chip = (ok, text, warn) => `<span class="${ok ? (warn ? "warn" : "ok") : "no"}">${text}</span>`;
    $("sys").innerHTML = [
      `<span>${s.env === "test" ? "Testversion" : "Produktiv"} · läuft seit ${s.uptimeH} h</span>`,
      chip(s.tiktok, "TikTok" + (s.tiktokUnaudited ? " (Sandbox)" : ""), s.tiktokUnaudited), chip(s.instagram, "Instagram"), chip(s.youtube, "YouTube"),
      chip(s.mail, "E-Mail-Versand"), chip(s.registration !== "closed", "Registrierung: " + ({ mail: "offen mit Bestätigung", invite: "mit Code", closed: "geschlossen" })[s.registration]),
      chip(s.groq, "Schnelle Untertitel (Groq)"), chip(s.claude, "KI-Auswahl (Claude)"), `<span>${s.running} Projekte in Arbeit</span>`,
    ].join("");
    // gleiche Meldungen zusammenfassen
    const g = new Map(); o.problems.forEach((p) => { const k = p.user + "|" + p.text; const e = g.get(k); if (e) e.n++; else g.set(k, { ...p, n: 1 }); });
    probs = [...g.values()];
    $("probCount").textContent = probs.length ? `(${probs.length})` : "";
    renderProbs();
  }

  async function loadUsers() { ({ users } = await api("/api/admin/users")); renderUsers(); }
  function renderUsers() {
    const q = $("q").value.trim().toLowerCase();
    const box = $("users"); box.innerHTML = '<div class="urow head"><span>Clipper</span><span>Accounts</span><span class="n">Projekte</span><span class="n">Posts</span><span class="n">Online</span><span class="n">Fehler</span><span>Zuletzt aktiv</span><span></span></div>';
    users.filter((u) => !q || (u.name + " " + u.email).toLowerCase().includes(q)).sort((a, b) => String(b.lastSeen || "").localeCompare(String(a.lastSeen || ""))).forEach((u) => {
      const r = document.createElement("div"); r.className = "urow";
      const tags = (u.role === "admin" ? '<span class="tag admin">Admin</span>' : "") + (u.disabled ? '<span class="tag off">Gesperrt</span>' : "") + (!u.verified ? '<span class="tag unv">Unbestätigt</span>' : "");
      r.innerHTML = `<span><b>${esc(u.name)}</b>${tags}<small>${esc(u.email)}</small></span>
        <span>${u.accountList.length ? u.accountList.map((a) => `<small${a.problem ? ' style="color:var(--err)"' : ""}>${PN[a.platform] || a.platform} · ${esc(a.username)}</small>`).join("") : '<small>keine</small>'}</span>
        <span class="n">${u.projects}</span><span class="n">${u.posts}</span><span class="n">${u.published}</span><span class="n ${u.errors ? "err" : ""}">${u.errors}</span>
        <span><small style="color:var(--ink)">${ago(u.lastSeen)}</small><small>seit ${u.createdAt ? new Date(u.createdAt).toLocaleDateString("de-DE") : "–"}</small></span><span class="act"></span>`;
      const act = r.lastElementChild;
      if (u.id !== session.user.id) {
        const btn = (label, body, confirmText) => { const b = document.createElement("button"); b.textContent = label;
          b.onclick = async () => { if (confirmText && !b.dataset.sure) { b.dataset.sure = 1; b.textContent = confirmText; return; } try { await api(`/api/admin/users/${u.id}`, { method: "PATCH", body }); await loadUsers(); loadOverview(); } catch (e) { banner(e.message, true); } };
          act.append(b); };
        if (!u.verified) btn("Bestätigen", { verify: true });
        btn(u.disabled ? "Freischalten" : "Sperren", { disabled: !u.disabled }, u.disabled ? null : "Wirklich sperren?");
        btn(u.role === "admin" ? "Admin entziehen" : "Zum Admin", { role: u.role === "admin" ? "clipper" : "admin" }, "Sicher?");
      } else act.innerHTML = '<small>das bist du</small>';
      box.append(r);
    });
  }
  $("q").oninput = renderUsers;
  $("probMore").onclick = () => { allProbs = !allProbs; renderProbs(); };
  $("copyInvite").onclick = async () => { try { await navigator.clipboard.writeText($("inviteLink").textContent); banner("Einladungslink kopiert."); } catch { banner("Bitte den Link markieren und kopieren.", true); } };
  $("reload").onclick = () => Promise.all([loadOverview(), loadUsers()]).catch((e) => banner(e.message, true));

  async function boot() {
    session = await api("/api/session");
    if (!session.user || session.user.role !== "admin") { location.href = "/"; return; }
    $("inviteLink").textContent = session.registration === "mail" ? location.origin + "/" : session.invite ? `${location.origin}/?einladung=${encodeURIComponent(session.invite)}` : "Registrierung ist gesperrt";
    await Promise.all([loadOverview(), loadUsers()]);
  }
  boot().catch((e) => banner(e.message, true));
  setInterval(() => { if (document.visibilityState === "visible") loadOverview().catch(() => {}); }, 60000);
})();
</script>
</body>
</html>
